name: Release

on:
  push:
    tags:
      - 'v*'

# Least-privilege by default; each job widens only what it needs.
permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub release and upload assets
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with write access to lmk123/homebrew-tap, so GoReleaser can push
          # the generated Homebrew cask there (the default GITHUB_TOKEN can't
          # reach another repo). Name must match the .Env ref in .goreleaser.yaml.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  npm:
    # Publish the npm wrapper package after the release assets exist, so the
    # postinstall download can find the matching binaries.
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for npm trusted publishing (OIDC) — no NPM_TOKEN
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve version and npm dist-tag
        id: ver
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # A semver pre-release (contains a hyphen, e.g. 3.0.0-beta.0) is
          # published under the `beta` dist-tag so it never claims `latest`.
          if [[ "$VERSION" == *-* ]]; then
            echo "npmtag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "npmtag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Set version from tag
        run: npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version

      # Auth comes from the OIDC token (id-token: write above); npm also
      # generates provenance automatically for public repo + public package.
      - name: Publish to npm
        run: npm publish --tag "${{ steps.ver.outputs.npmtag }}"
